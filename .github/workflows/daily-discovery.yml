
name: Daily Research Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily discovery
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          DISCORD_WEBHOOK_OPPORTUNITIES: ${{ secrets.DISCORD_WEBHOOK_OPPORTUNITIES }}
          DISCORD_WEBHOOK_PATENTS_MAIN: ${{ secrets.DISCORD_WEBHOOK_PATENTS_MAIN }}
          DISCORD_WEBHOOK_PATENTS_EXPLORE: ${{ secrets.DISCORD_WEBHOOK_PATENTS_EXPLORE }}
          DISCORD_WEBHOOK_DAILY_NEWS: ${{ secrets.DISCORD_WEBHOOK_DAILY_NEWS }}
          DISCORD_WEBHOOK_STATUS: ${{ secrets.DISCORD_WEBHOOK_STATUS }}
        run: python -m cloud.main
